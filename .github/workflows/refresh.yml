name: Publish Kansas scouting board
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: blueprint-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify model and application
        run: |
          cd rebuild
          python -m unittest discover -s tests -v
          node --check web/app.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Stage public assets only
        run: |
          mkdir -p _site
          cp index.html styles.css app.js data.js _site/
          cp -R assets legacy _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
